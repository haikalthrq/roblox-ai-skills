name: Codex adapter offline tests

on:
  push:
    branches: [dev]
    paths:
      - "codex/**"
      - "tests/**"
      - ".github/workflows/codex-adapter-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run offline regression tests
        run: |
          python -m compileall -q codex tests
          python -m unittest discover -s tests -p "test_codex*.py" -v
